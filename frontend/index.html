<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/autolaya-logo.svg" />
    <title>AutoLaya</title>
    <script>
      (function () {
        const mode = localStorage.getItem("autolaya-theme");
        const dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        const lang = localStorage.getItem("autolaya-lang");
        if (lang) document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
